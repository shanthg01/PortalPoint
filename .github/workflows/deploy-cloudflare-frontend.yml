name: deploy-cloudflare-frontend

# Separate from deploy.yml (AWS: S3 + CloudFront) -- this deploys the same
# frontend to the no-VM/zero-cost stack's Cloudflare Workers static-asset
# service instead. The two paths are dual-hosted and independently
# triggerable; this one does not touch AWS, deploy.yml does not touch
# Cloudflare.
#
# Render (backend) already auto-deploys on push to main via its own git
# integration (see docs/selfhost_no_vm_runbook.md) -- no GitHub Actions step
# needed for that half. This workflow covers the frontend.
#
# WARNING (found 2026-09-09, real incident): Cloudflare's own native
# GitHub-connected "Workers Builds" ALSO fires on push to main for this
# service, independent of this workflow -- confirmed via the Workers API
# version history (a version with source="wrangler" appeared ~48s after a
# merge, far too fast to be this workflow, which takes 3+ min to reach its
# deploy step). It does NOT set VITE_API_BASE_URL (that's not a Workers
# runtime var, it's a Vite build-time value with no equivalent in
# Cloudflare's build UI as configured), so it silently deploys a BROKEN
# bundle (relative '/api' baseURL, same bug this workflow exists to
# prevent) on every push to main -- confirmed live, had to be manually
# fixed via a local `wrangler deploy` with the correct env var set. This
# earlier comment previously said no such integration existed
# ("last_deployed_from was empty") -- that was true for the ORIGINAL
# manual deploy, not proof no git integration was ever connected since.
# **Disconnect Cloudflare's native build for this service** (dashboard ->
# Workers & Pages -> portalpoint -> Settings -> Build) so this workflow is
# the only thing that ever deploys it -- not done yet as of this comment,
# could not find an API path to do it from here. Until that's done, ANY
# push to main touching frontend/** risks a race between this workflow and
# Cloudflare's own build; whichever finishes last wins.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-cloudflare-frontend.yml"
  workflow_dispatch: {}

env:
  # Public URL, not a secret -- the live Render backend for the no-VM stack.
  # Update this if the Render service is ever recreated under a new URL.
  VITE_API_BASE_URL: "https://portalpoint.onrender.com/api"

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Wrangler 4.130.0 (pinned below) requires Node >=22 -- real
          # failure (2026-09-09): left at 20, wrangler-action installed
          # 4.130.0 anyway (per the pin) then refused to run ("Wrangler
          # requires at least Node.js v22.0.0"), failing the job after
          # already having built successfully -- a second, different
          # failure mode from the original Wrangler-3-vs-assets-only-config
          # one the pin below was added for.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
        # VITE_API_BASE_URL is read from the job-level env above -- Vite
        # bakes it into the JS bundle at this step, not at deploy time.
        # This is the exact bug this workflow exists to prevent: the
        # bundle must be built with the right value BEFORE wrangler
        # uploads it, since Cloudflare has no build step of its own here.

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: deploy
          # Real failure (2026-09-09): left unpinned, the action auto-installs
          # whatever it considers "compatible" -- picked Wrangler 3.90.0,
          # which doesn't understand an assets-only wrangler.jsonc with no
          # `main` field ("Missing entry-point" error, job failed outright).
          # That's a Wrangler 4+ capability. Pin explicitly so this doesn't
          # silently regress again on some future wrangler-action default change.
          wranglerVersion: "4.130.0"
          # No --env flag: the "portalpoint" service's default environment
          # IS production (Cloudflare dashboard shows this as metadata, not
          # a wrangler [env.production] block). Passing --env production
          # here with no matching config section creates a SEPARATE new
          # worker (portalpoint-production) instead of updating the real
          # one -- this happened once already during manual setup, the
          # stray worker was deleted by hand. Do not add --env back.

      - name: Verify deploy
        run: |
          sleep 5
          BUNDLE=$(curl -s https://portalpoint.shanthg01.workers.dev/ | grep -o 'assets/index-[^"]*\.js' | head -1)
          curl -s "https://portalpoint.shanthg01.workers.dev/$BUNDLE" | grep -q "portalpoint.onrender.com" \
            && echo "OK: deployed bundle points at the Render backend" \
            || (echo "FAIL: deployed bundle does not reference the backend URL" && exit 1)
