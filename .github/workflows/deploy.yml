name: deploy

# AWS stack (ECS/ECR/CloudFront) is being decommissioned -- see
# docs/aws_decommission_runbook.md. Push-to-main trigger removed so merges no
# longer deploy to AWS; kept as manual-dispatch only as the deploy path for a
# rebuild from infra/aws/ (runbook: "Rebuilding the AWS stack"). Live app is
# now Render + Cloudflare Workers (docs/selfhost_no_vm_runbook.md).
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: portalpoint-backend

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::424056758764:role/portalpoint-gha-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, push
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Run DB migrations (one-off ECS task, must succeed before deploy)
        run: |
          # Reuse the running service's own network config (subnets/SG) instead of
          # hardcoding IDs here — stays correct automatically if that ever changes.
          NETWORK_CONFIG=$(aws ecs describe-services \
            --cluster portalpoint-prod --services portalpoint-backend \
            --query 'services[0].networkConfiguration' --output json)

          # ECS run-task's `overrides.containerOverrides` schema does not support a
          # `secrets` key (ParamValidationError — that key only exists at task-definition
          # registration time, real failure hit on 2026-07-21). So instead of overriding
          # DATABASE_URL at run-task time, derive a one-off "migrate" task-definition
          # revision from the live portalpoint-backend def every run — same image/cpu/
          # mem/roles, just DATABASE_URL's secret swapped to the master-user ARN (some
          # tables aren't owned by portalpoint_app, the app's runtime user, so DDL fails
          # under it — real incident, 2026-07-20, see docs/status/ARCHITECTURE_STATUS.md).
          # Deriving from the live def each run (rather than a static separate task-def)
          # keeps it correct automatically if image/cpu/mem/env ever change.
          LIVE_TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition portalpoint-backend --query 'taskDefinition')

          MIGRATE_CONTAINER_DEFS=$(echo "$LIVE_TASK_DEF" | jq '
            .containerDefinitions | map(
              if .name == "backend" then
                .secrets = ((.secrets // []) | map(select(.name != "DATABASE_URL")) + [
                  {"name": "DATABASE_URL", "valueFrom": "arn:aws:secretsmanager:us-east-1:424056758764:secret:portalpoint/database-master-url"}
                ])
              else . end
            )')

          MIGRATE_TASK_DEF=$(echo "$LIVE_TASK_DEF" | jq --argjson cd "$MIGRATE_CONTAINER_DEFS" '{
            family: "portalpoint-backend-migrate",
            networkMode: .networkMode,
            requiresCompatibilities: .requiresCompatibilities,
            cpu: .cpu,
            memory: .memory,
            executionRoleArn: .executionRoleArn,
            taskRoleArn: .taskRoleArn,
            containerDefinitions: $cd
          }')

          aws ecs register-task-definition --cli-input-json "$MIGRATE_TASK_DEF" >/dev/null

          # Only a command override needed now — DATABASE_URL is already baked into
          # the portalpoint-backend-migrate task-def registered above.
          TASK_ARN=$(aws ecs run-task \
            --cluster portalpoint-prod \
            --task-definition portalpoint-backend-migrate \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --overrides '{
              "containerOverrides": [{
                "name": "backend",
                "command": ["alembic", "upgrade", "head"]
              }]
            }' \
            --query 'tasks[0].taskArn' --output text)

          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster portalpoint-prod --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster portalpoint-prod --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed with exit code $EXIT_CODE — aborting deploy, service is untouched."
            aws logs tail /ecs/portalpoint-backend --since 10m || true
            exit 1
          fi
          echo "Migrations applied successfully."

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster portalpoint-prod \
            --service portalpoint-backend \
            --force-new-deployment

  deploy-frontend:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::424056758764:role/portalpoint-gha-deploy
          aws-region: ${{ env.AWS_REGION }}

      # Waits for the new backend task to actually be running and healthy before
      # publishing frontend code that may call new/changed endpoints — same
      # ordering the manual "Day 2" checklist (docs/production_deployment_commands.md)
      # already calls for, just enforced instead of relied on.
      - name: Wait for backend service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster portalpoint-prod --services portalpoint-backend

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Sync to S3 and invalidate CloudFront
        run: |
          aws s3 sync frontend/dist/ s3://portalpoint-frontend --delete
          aws cloudfront create-invalidation --distribution-id E2HF7HKH8Y1FKD --paths "/*"
