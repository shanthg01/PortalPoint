name: keep-render-warm

# Render's free Web Service tier spins the container down after ~15min idle,
# then takes ~30-50s to wake on the next real request -- this is what made
# login/page loads feel "stuck" after any quiet period (confirmed via direct
# timing: warm-state requests are consistently <0.3s across health, DB-backed,
# and heavy-query endpoints alike -- the backend itself isn't slow, idle
# spin-down is). Pinging /health well inside that 15min window is meant to
# keep the container from ever going idle long enough to spin down.
#
# ⚠️ Real reliability problem found (2026-09-09): GitHub's `schedule` trigger
# is best-effort, not a real cron daemon -- in practice this fired only
# twice in the first several hours after being merged, ~2h34min apart, each
# time timing out (curl's own --max-time) because the container had gone
# cold far longer than the intended 15min window. GitHub's own docs only
# describe "might be delayed during high load," not multi-hour gaps -- this
# is worse than documented, and changing the schedule alone may not fully
# fix it. Bumped to */5 (GitHub's documented minimum granularity) as a
# real, testable attempt, and widened the timeout so a ping that does land
# on a genuinely cold container doesn't fail outright. If GH's scheduler
# still can't hold a tight enough cadence, the real fix is an external
# uptime monitor (cron-job.org / UptimeRobot free tier) -- those are built
# for reliable frequent pings, GH Actions schedule explicitly is not.
#
# Timeout raised 120s -> 180s (2026-10-05): cold starts now take ~100-150s
# (measured 98s and >150s), so a ping landing on a cold container was
# failing with curl exit 28 (3 of 159 runs) even though Render recovered.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 180 https://portalpoint.onrender.com/health)
          echo "Response: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Health check returned $STATUS instead of 200"
          fi
